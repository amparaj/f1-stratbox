# Rebuilds the website and publishes it to GitHub Pages (the gh-pages branch).
#
# Scheduled runs first ask scripts/needs_update.py (standard library only, a few seconds) whether
# anything is due: a session (qualifying, sprint, race) whose chequered flag is out (OpenF1) but isn't on the site, a
# provisional result whose official classification may now be out (hourly at most), or data more
# than a week old. Checking every 10 minutes over the weekend puts a race on the site about
# 15-40 minutes after the flag (GitHub often starts scheduled runs late).
# Only then do they export the data (scripts/export_site.py), build the site and publish it.
# A push to main that touches the code, or Run workflow by hand, always rebuilds.
#
# Session data comes from the OpenF1 API (modules/openf1.py): F1's live-timing server, which
# FastF1 reads, doesn't answer GitHub's runners. FastF1 still provides the calendar. A session
# that's final (4 days on, result and grid in) is written to archive/ and committed to main by
# this workflow, and read from there for good. Newer sessions go through download caches
# (.openf1/, .fastf1/, .openmeteo/) kept between runs with actions/cache. Weather comes from
# Open-Meteo (free, no key): forecasts, and climate downloads that never change once fetched. Penalties come from
# f1penalties.com (every stewards' decision, fetched again every run; a season archived once it's over) and the
# FIA's power-unit documents (PDFs, an event archived 4 days after its race): needs_update.py also rebuilds when
# either has something new. F1 news (RSS: The Race, Crash.net, Autosport, Motorsport.com, Formula1.com, BBC, Sky,
# GPFans) is read on every export and kept in .news/ (cached here); needs_update.py rebuilds as soon as a feed has a new power-unit penalty headline (a reported
# penalty moves the forecasts), and every 12 h for the rest. The History pages (every season since
# 1950) are rebuilt each run from archive/jolpica/, one file per finished season; Jolpica's dump
# (cached in .jolpica/) is downloaded only for a season not archived yet, which is then committed.
#
# Scheduled workflows only run from the default branch.
name: Update site

on:
  schedule:
    - cron: "*/10 * * * 5,6,0"  # every 10 minutes Friday to Sunday (UTC): qualifying, sprints, races
    - cron: "20 * * * 1-4"      # hourly otherwise: provisional results, late grids, penalty news
  push:
    branches: [main]
    paths:
      - "web/**"
      - "modules/**"
      - "scripts/**"
      - "config.py"
      - "pyproject.toml"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

env:
  SITE_URL: https://amparaj.github.io/f1-stratbox/

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Anything new?
        id: check
        if: github.event_name == 'schedule'
        run: python scripts/needs_update.py "${SITE_URL}data/meta.json"

      # Restore and save separately, so what a failed or rate-limited run downloaded is kept.
      - name: Restore download cache
        if: github.event_name != 'schedule' || steps.check.outputs.update == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            .openf1
            .jolpica
            .fastf1
            .openmeteo
            .fia
            .f1penalties
            .news
            .snapshots
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: Install
        if: github.event_name != 'schedule' || steps.check.outputs.update == 'true'
        run: |
          pip install --quiet -e .

      - name: Export data
        if: github.event_name != 'schedule' || steps.check.outputs.update == 'true'
        run: python scripts/export_site.py

      # Finished sessions (modules/openf1.py) and seasons (modules/history.py) go into archive/
      # and are never fetched again.
      # Pushes made with the workflow's token don't start another run.
      - name: Commit new archive files
        if: github.event_name != 'schedule' || steps.check.outputs.update == 'true'
        run: |
          git add archive
          if git diff --cached --quiet; then echo "Nothing new to archive."; exit 0; fi
          n=$(git diff --cached --name-only | wc -l)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Archive ${n} finished session(s)"
          git pull --rebase --quiet origin main
          git push --quiet origin HEAD:main
          echo "Archived ${n} session(s)."

      - name: Save download cache
        if: always() && (github.event_name != 'schedule' || steps.check.outputs.update == 'true')
        uses: actions/cache/save@v4
        with:
          path: |
            .openf1
            .jolpica
            .fastf1
            .openmeteo
            .fia
            .f1penalties
            .news
            .snapshots
          key: data-${{ github.run_id }}

      - uses: actions/setup-node@v5
        if: github.event_name != 'schedule' || steps.check.outputs.update == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build
        if: github.event_name != 'schedule' || steps.check.outputs.update == 'true'
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Publish to gh-pages
        if: github.event_name != 'schedule' || steps.check.outputs.update == 'true'
        working-directory: web/dist
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One fresh commit each time: the branch is the built site, never edited by hand.
          touch .nojekyll
          git init --quiet -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Site $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push --quiet --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "Published to ${SITE_URL}"
